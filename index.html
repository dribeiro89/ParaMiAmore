.seq{font-size:1.5rem;font-weight:700;margin:14px 0;letter-spacing:.2em;word-break:break-all;color:var(--terra)}
input.resp{width:100%;padding:12px;font-size:1.2rem;text-align:center;border-radius:12px;border:2px solid var(--linea);background:#fff;color:var(--txt);text-transform:uppercase;font-family:inherit}
button{background:linear-gradient(90deg,var(--azul),var(--terra));color:#fff;border:none;border-radius:14px;padding:13px 22px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;margin-top:12px;font-family:inherit}

.sec{background:var(--muted);margin-top:16px}

/* ===== GENERADORES ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mezclar(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function revolver(palabra,seed){
  const rnd=mulberry32(seed);
  let r;
  do{ r=mezclar(palabra.split(''),rnd).join('') }while(r===palabra);
  return r;
}

}

/* ===== FECHAS ===== */
function hoy(){
  const h=fechaSim || new Date();
  return new Date(h.getFullYear(),h.getMonth(),h.getDate());
}
function hoyNum(){ return Math.round((hoy()-INICIO)/86400000)+1 }
function diasHastaInicio(){ return Math.round((INICIO-hoy())/86400000) }
function diaActual(){ return Math.min(hoyNum(),DIAS) }

/* ===== AVISOS (notificación por email) ===== */
function notificar(asunto, detalle){
  if(ES_TEST || !AVISO_URL.startsWith('http')) return;
  fetch(AVISO_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({asunto,detalle})}).catch(()=>{});
}

/* ===== MÚSICA ===== */
const audio=new Audio();
audio.loop=true;
audio.addEventListener('play',pintarMusica);
audio.addEventListener('pause',pintarMusica);
function pintarMusica(){
  const cont=document.getElementById('musica');
  const n=diaActual();
  if(hoyNum()<1 || n>4){ cont.innerHTML=''; return; }
  const f=MUSICA[n];
  if(audio.getAttribute('data-f')!==f){
    audio.setAttribute('data-f',f);
    audio.src=f;
  }
  cont.innerHTML=`<div class="musica"><button onclick="toggleMusica()">${audio.paused?'🎵 Activar música':'⏸ Pausar música'}</button></div>`;
}
function toggleMusica(){
  if(audio.paused) audio.play().catch(()=>{});
  else audio.pause();
}

/* ===== PANEL DE PRUEBA (solo con ?teste) ===== */
function pintarPanel(){
  if(!ES_TEST) return;
  const f=hoy();
  const iso=`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
  document.getElementById('panel').innerHTML=`<div class="panel">
    <strong>Modo prueba</strong>
    <label>Fecha simulada<input type="date" value="${iso}" onchange="cambiarFecha(this.value)"></label>
    <button onclick="reiniciar()">Reiniciar progreso</button>
  </div>`;
}
function cambiarFecha(v){
  const [y,m,d]=v.split('-').map(Number);
  fechaSim=new Date(y,m-1,d);
  menuRuta=[]; puzzle=null;
  render();
}
function reiniciar(){
  if(!confirm('¿Borrar todo el progreso de prueba?')) return;
  localStorage.removeItem(SAVE);
  estado={pasos:{},tipo:null,hotel:null};
  menuRuta=[]; puzzle=null;
  render();
}

/* ===== GALERÍA ===== */
let galHotel=null, galIdx=0;
function abrirGaleria(i){
  galHotel=HOTELES[estado.tipo][i];
  galIdx=0;
  pintarGaleria();
  document.getElementById('gal').classList.add('on');
}
function pintarGaleria(){
  const fotos=fotosDe(galHotel);
  const img=document.getElementById('galImg');
  img.src=fotos[galIdx];
  img.onerror=()=>{ img.alt='Foto no disponible'; };
  document.getElementById('galCont').textContent=`${galHotel.nombre} · ${galIdx+1} / 4`;
}
function moverGaleria(d){
  galIdx=(galIdx+d+4)%4;
  pintarGaleria();
}
function cerrarGaleria(){
  document.getElementById('gal').classList.remove('on');
}

/* ===== PANTALLAS ===== */
function render(){
  pintarPanel();
  pintarMusica();
  if(hoyNum()<1){ mostrarIntroPrevia(); return; }
  const n=diaActual();
  sub.textContent=`Día ${n} de ${DIAS}`;
  if(n===DIAS){ mostrarFinal(); return; }
  const pasos=PASOS[n];
  const idx=estado.pasos[n]||0;
  if(idx>=pasos.length){ mostrarCarta(n); return; }
  ejecutarPaso(n, idx, pasos[idx]);
}

function avanzar(n){
  estado.pasos[n]=(estado.pasos[n]||0)+1;
  guarda();
  menuRuta=[]; puzzle=null;
  render();
}

function ejecutarPaso(n,i,p){
  switch(p.t){
    case 'anagrama': return mostrarAnagrama(n,i,p);
    case 'intruso':  return mostrarIntruso(n,i,p);
    case 'revelar':  return mostrarRevelar(n,i,p);
    case 'hotel':    return mostrarHotelPaso();
    case 'menu':     return mostrarMenu(n,i,p);
    case 'aviso':    return mostrarAviso(n,i,p);
    case 'puzzle':   return mostrarPuzzle(n,i);
  }
}

function mostrarIntroPrevia(){
  sub.textContent=`Faltan ${diasHastaInicio()} días para el 25 de octubre`;
  area.innerHTML=`<div class="intro">${PARTES.map(p=>`<p>${p}</p>`).join('')}</div>`;
}

function mostrarAnagrama(n,i,p){
  const letras=revolver(p.palabra, n*101+i);
  area.innerHTML=`${p.intro?`<p class="pregunta">${p.intro}</p>`:''}
    <span class="tipo">Palabra desordenada</span>
    <p class="pregunta">Reordena las letras para formar la palabra.</p>
    <div class="seq">${letras.split('').join(' ')}</div>
    <p class="sub">Pista: ${p.pista}</p>
    <input class="resp" id="r" autocomplete="off" autocapitalize="characters" placeholder="Respuesta">
    <button onclick="respAnagrama(${n},${i})">Confirmar</button>
    <div class="error" id="error"></div>`;
}

function respAnagrama(n,i){
  const v=document.getElementById('r').value.trim().toUpperCase();
  if(v===PASOS[n][i].palabra) avanzar(n);
  else document.getElementById('error').textContent='Todavía no es esa. ¡Inténtalo otra vez!';
}

function mostrarIntruso(n,i,p){
  const ops=mezclar(p.opciones, mulberry32(n*37+i));
  area.innerHTML=`<span class="tipo">Palabra intrusa</span>
    <p class="pregunta">¿Cuál de estas palabras no pertenece al grupo?</p>
    <div class="opciones">${ops.map((o,k)=>`<button class="op" onclick="respIntruso(${n},${i},${k})">${o}</button>`).join('')}</div>
    <div class="error" id="error"></div>`;
}

function respIntruso(n,i,k){
  const p=PASOS[n][i];
  const ops=mezclar(p.opciones, mulberry32(n*37+i));
  if(ops[k]===p.correcta) avanzar(n);
  else document.getElementById('error').textContent='No es esa. ¡Inténtalo otra vez!';
}

function mostrarRevelar(n,i,p){
  area.innerHTML=`<div class="revelar">
    <span class="tipo">${p.titulo?'Para ti':'Sorpresa'}</span>
    ${p.titulo?`<h2 style="margin:8px 0;color:var(--azul);font-size:1.2rem">${p.titulo}</h2>`:''}
    <p class="texto">${p.texto}</p>
    ${p.img?`<img src="${p.img}" alt="" onerror="this.remove()">`:''}
    <button onclick="avanzar(${n})">Continuar</button>
  </div>`;
}

function mostrarAviso(n,i,p){
  area.innerHTML=`<span class="tipo">${p.etiqueta}</span>
    <div class="aviso"><strong>${p.titulo}</strong><p style="margin:8px 0 0;line-height:1.5">${p.texto}</p></div>
    <button onclick="avanzar(${n})">Continuar</button>`;
}

/* ----- Menú de dos niveles con botón de volver ----- */
function nodoRuta(raiz, ruta){
  let nodo=raiz;
  ruta.forEach(k=>{ nodo=nodo.opciones[k].sub });
  return nodo;
}

function mostrarMenu(n,i,p){
  const nodo=nodoRuta(p.raiz, menuRuta);
  const volver=menuRuta.length?`<button class="volver" onclick="volverMenu(${n},${i})">‹ Volver atrás</button>`:'';
  const botones=nodo.opciones.map((o,k)=> o.sub
     ? `<button class="op" style="width:100%" onclick="entrarMenu(${n},${i},${k})">${o.texto}</button>`
     : `<button class="op" style="width:100%" onclick="escoger(${n},${i},${k})">${o.texto}<br><small style="font-weight:400">Escoger</small></button>`
  ).join('');
  area.innerHTML=`<span class="tipo">${p.etiqueta}</span>
    <p class="pregunta">${nodo.pregunta}</p>
    <div class="opc-col">${botones}</div>
    ${volver}`;
}

function entrarMenu(n,i,k){ menuRuta.push(k); render(); }
function volverMenu(n,i){ menuRuta.pop(); render(); }

function escoger(n,i,k){
  const p=PASOS[n][i];
  let nodo=p.raiz;
  const camino=[p.etiqueta];
  menuRuta.forEach(j=>{ camino.push(nodo.opciones[j].texto); nodo=nodo.opciones[j].sub });
  camino.push(nodo.opciones[k].texto);
  notificar(`Elección: ${p.etiqueta}`, camino.join(' › '));
  avanzar(n);
}

/* ----- Hotel ----- */
function mostrarHotelPaso(){
  if(!estado.tipo) mostrarTipos();
  else mostrarHoteles();
}

function mostrarTipos(){
  const tipos=Object.keys(HOTELES);
  area.innerHTML=`<span class="tipo">Escapadita</span>
    <p class="pregunta">Primero, elige el tipo de estadia.</p>
    <div class="opciones">
      ${tipos.map(t=>`<button class="op" onclick="elegirTipo('${t}')">${t}</button>`).join('')}
    </div>`;
}

function mostrarHoteles(){
  const lista=HOTELES[estado.tipo];
  area.innerHTML=`<span class="tipo">${estado.tipo}</span>
    <p class="pregunta">Mira las fotos y elige dónde quieres pasar el fin de semana.</p>
    ${lista.map((h,i)=>`<div class="hotel-card">
        <img src="${fotosDe(h)[0]}" alt="" onclick="abrirGaleria(${i})" onerror="this.remove()">
        <span class="nombre">${h.nombre}</span>
        <small>${h.desc}</small>
        <div class="acciones">
          <button class="ver" onclick="abrirGaleria(${i})">Ver fotos</button>
          <button onclick="elegirHotel(${i})">Escoger</button>
        </div>
      </div>`).join('')}
    <button class="sec" onclick="cambiarTipo()">Cambiar tipo de estadia</button>`;
}

function elegirTipo(t){
  estado.tipo=t;
  guarda();
  render();
}

function cambiarTipo(){
  estado.tipo=null;
  estado.hotel=null;
  guarda();
  render();
}

function elegirHotel(i){
  const h=HOTELES[estado.tipo][i];
  estado.hotel=h.nombre;
  notificar('Hotel elegido', `${estado.tipo} › ${h.nombre}`);
  avanzar(diaActual());
}

/* ----- Puzzle ----- */
function mostrarPuzzle(n,i){
  if(!puzzle || puzzle.dia!==n){
    let o=[0,1,2,3,4,5,6,7,8];
    do{ o=mezclar(o, Math.random) } while(o.every((v,k)=>v===k));
    puzzle={dia:n, orden:o, sel:null, img:PUZZLES[n]};
  }
  area.innerHTML=`<span class="tipo">Puzzle</span>
    <p class="pregunta">Toca dos piezas para cambiarlas de sitio. Cuando la foto esté completa, se abrirá tu mensaje de hoy.</p>
    <div class="puzzle" id="tablero"></div>`;
  pintarTablero();
}

function pintarTablero(){
  document.getElementById('tablero').innerHTML=puzzle.orden.map((v,k)=>
    `<div class="pieza ${puzzle.sel===k?'sel':''}" style="background-image:url('${puzzle.img}');background-position:${(v%3)*50}% ${Math.floor(v/3)*50}%" onclick="tocarPieza(${k})"></div>`
  ).join('');
}

function tocarPieza(k){
  if(puzzle.sel===null){ puzzle.sel=k; }
  else if(puzzle.sel===k){ puzzle.sel=null; }
  else {
    const s=puzzle.sel;
    [puzzle.orden[s], puzzle.orden[k]]=[puzzle.orden[k], puzzle.orden[s]];
    puzzle.sel=null;
    if(puzzle.orden.every((v,x)=>v===x)){
      avanzar(puzzle.dia);
      return;
    }
  }
  pintarTablero();
}

/* ----- Carta del día (misma foto que el puzzle) ----- */
function mostrarCarta(n){
  const c=CARTAS[n];
  area.innerHTML=`<div class="carta">
    <span class="tipo">Para ti · carta ${n} de 4</span>
    <h2>${c.titulo}</h2>
    <img class="foto-carta" src="${FOTO_DIA[n]}" alt="" onerror="this.remove()">
    <p class="texto-carta">${c.texto}</p>
    <p class="firma">Con todo mi amor 💕</p>
    <p class="sub" style="margin-top:14px">Vuelve mañana para la siguiente sorpresa 💌</p>
  </div>`;
}

function mostrarFinal(){
  sub.textContent='';
  area.innerHTML=`<div class="corazon">💌</div><p class="pregunta">${MENSAJE_FINAL}</p>`;
}

render();
</script>
</body>
</html>
